apply plugin: 'com.android.application'

// Wear OS 3+ only (minSdk 30) for this first slice -- keeps the module to
// plain Activity/View code (no Compose, no Kotlin toolchain change for a
// repo that is otherwise pure Java) while still covering the watches this
// feature is actually being built for. Wear OS 2 (API < 30) support, if
// ever needed, is a deliberate later decision, not an oversight here.
android {
    namespace = "com.lifeplansystem.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lifeplansystem.wear"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
    }
}

// No dependencies at all for this slice -- androidx.wear:wear pulled in a
// Kotlin stdlib version that duplicate-classed against another transitive
// dependency (found via CI's real build failing checkDebugDuplicateClasses,
// not assumed in advance), and its BoxInsetLayout attribute didn't resolve
// either. A plain android.widget layout needs neither, and round-screen
// inset handling is a polish detail this placeholder screen doesn't need.
dependencies {
}
