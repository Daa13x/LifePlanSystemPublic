apply plugin: 'com.android.application'

// Wear OS 3+ only (minSdk 30) for this first slice -- keeps the module to
// plain Activity/View code (no Compose, no Kotlin toolchain change for a
// repo that is otherwise pure Java) while still covering the watches this
// feature is actually being built for. Wear OS 2 (API < 30) support, if
// ever needed, is a deliberate later decision, not an oversight here.
android {
    namespace = "com.lifeplansystem.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lifeplansystem.wear"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.wear:wear:1.3.0"
}
