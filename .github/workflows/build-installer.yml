# Build Installer — CI/CD pipeline for the Life Planner portable + Inno installer.
#
# Hosted push and release-targeted runs were validated on 2026-07-17. Local
# packaging and portable-runtime verification use the same scripts as this job.
#
# What it does: on a push to main, on a version tag, or on manual dispatch, it
# builds the web app, packages the portable one-folder bundle, compiles the Inno
# Setup installer, and uploads the results as downloadable artifacts. Every
# successful push to main also replaces the rolling latest-main Release so the
# downloadable installer follows main automatically. Version tags continue to
# publish immutable versioned releases. AI systems are tools and are never
# published as authors, contributors, taggers, or release owners.

name: Build Installer

on:
  push:
    branches: [main]
    tags: ['*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag to attach the installer to (for example: 1.0 or v1.0.0)'
        required: false
        type: string

permissions:
  contents: write # build artifacts plus rolling/versioned Release assets
  issues: write # stale-build reporting when a main installer cannot be produced

concurrency:
  group: build-installer-${{ github.event.release.tag_name || github.ref || github.run_id }}
  # Only the newest main commit should consume the rolling installer pipeline.
  # Older in-progress main builds must never overwrite a newer release target.
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      # Let npm retry package transport failures internally without retrying tests,
      # builds, lifecycle scripts, or other deterministic commands.
      NPM_CONFIG_FETCH_RETRIES: '3'
      NPM_CONFIG_FETCH_RETRY_FACTOR: '2'
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # As soon as main advances, the old executable is no longer current. Mark
      # that state before the expensive build starts so a stale asset is never
      # silently presented as the latest code.
      - name: Mark rolling release as rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA
          gh release view 'latest-main' --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            $notes = "Main advanced to commit $sha and the replacement installer is being built. Existing assets belong to an older successful commit and must not be treated as current until this workflow succeeds."
            gh release edit 'latest-main' --repo $repo --title 'Latest main build (REBUILDING)' --notes $notes
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      # The native host targets net9.0-windows. Runners now ship .NET 10, so
      # install the net9.0 SDK explicitly; setup-dotnet sets DOTNET_ROOT, which
      # scripts/build-native.ps1 resolves first, so the native build matches the
      # local toolchain instead of failing the SDK version gate.
      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify maintainer-only attribution
        shell: pwsh
        run: >
          node scripts/verify-maintainer-attribution.mjs
          "${{ github.event.before }}"
          "${{ github.sha }}"
          "${{ github.ref }}"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # verify:runtime-safety includes verify:local-ai-docs, which renders a PDF
      # via Playwright Chromium. Install the matching browser (and its headless
      # shell) before the safety suite runs, otherwise browserType.launch fails
      # with "Executable doesn't exist" and the whole installer build aborts.
      # Browser download is an external transport operation, so retry it in a
      # bounded way without ever retrying the verification suite itself.
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Playwright Chromium install attempt $attempt/3"
            npx playwright install chromium
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          throw 'Playwright Chromium installation failed after 3 attempts.'

      # Keep the complete safety output as a failure artifact. This is Windows-
      # native and explicitly checks the external process exit code, avoiding the
      # fragile Bash/tee diagnostic experiment that was reverted on 2026-08-20.
      - name: Verify runtime safety
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'lps-ci-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $log = Join-Path $diagnostics 'runtime-safety.log'
          npm run verify:runtime-safety 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime safety verification failed with exit code $LASTEXITCODE."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Inno Setup install attempt $attempt/3"
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          throw 'Inno Setup installation failed after 3 attempts.'

      # The shared installer build script reuses the workflow's npm ci + build,
      # installs Playwright Chromium into the packaged app, and compiles the
      # Inno installer.
      - name: Build portable bundle + installer
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1
          -SkipDependencyInstall
          -SkipBuild

      # Exercise the packaged Node runtime + production dist in a real browser
      # before either artifact can be uploaded or published. The verifier uses
      # a disposable database and proves CSRF, durable Chat idempotency, local
      # grounding, persistence/reopen, and cloud-egress review boundaries.
      - name: Verify packaged Chat
        run: npm run verify:installed-chat -- release/LifePlannerPortable

      - name: Upload portable bundle
        uses: actions/upload-artifact@v7
        with:
          name: LifePlannerPortable
          path: release/LifePlannerPortable
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: LifePlannerPortableSetup
          path: release/LifePlannerPortableSetup.exe
          if-no-files-found: error

      # A successful main build becomes the public rolling installer. The tag is
      # deliberately moved to the exact main commit that produced the assets.
      - name: Publish rolling latest-main Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'latest-main'
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA
          $title = 'Latest main build'
          $notes = "LifePlanSystem latest main build. Owner and maintainer: Daa13x. Built automatically from main commit $sha. AI tools are not project contributors. This rolling release is replaced after every successful push to main."
          $installer = 'release/LifePlannerPortableSetup.exe'
          $portableZip = 'release/LifePlannerPortable.zip'

          # A newer push may arrive during packaging. Never let this older run
          # move latest-main backwards or overwrite assets for the newer commit.
          $remoteMain = gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to resolve the current remote main commit.' }
          if ($remoteMain.Trim() -ne $sha) {
            Write-Host "Skipping rolling publication because main advanced from $sha to $remoteMain. The newer workflow run owns publication."
            exit 0
          }

          if (Test-Path -LiteralPath $portableZip) {
            Remove-Item -LiteralPath $portableZip -Force
          }
          Compress-Archive -Path 'release/LifePlannerPortable/*' -DestinationPath $portableZip -CompressionLevel Optimal

          # This identity is used only for the mechanical lightweight-tag move.
          # It does not author a commit and is not included as a contributor.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force $tag $sha
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the rolling release tag.' }
          git push origin "refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0) { throw 'Failed to move the rolling release tag to main.' }

          gh release view $tag --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $repo --target $sha --title $title --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the rolling GitHub Release.' }
            gh release upload $tag $installer $portableZip --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to replace the rolling Release assets.' }
          } else {
            gh release create $tag $installer $portableZip --repo $repo --target $sha --title $title --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the rolling GitHub Release.' }
          }

          $published = gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $published.Trim() -ne $sha) {
            throw "Rolling release verification failed: expected $sha but latest-main resolves to $published."
          }

      # Release 1.0 was created with automatically generated notes that displayed
      # an AI tool as a contributor. Keep the historical tag and binary unchanged,
      # but replace that generated text with maintainer-owned release notes.
      - name: Correct legacy 1.0 release attribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          gh release view '1.0' --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            $notes = @"
          LifePlanSystem Release 1.0

          Owner and maintainer: Daa13x.

          This is the original 1.0 installer snapshot. AI systems were used only as tools and are not project authors or contributors. For the current installer built from main, use the Latest main build release.
          "@
            gh release edit '1.0' --repo $repo --title 'Release 1.0' --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to correct Release 1.0 attribution notes.' }
          }

      # Explicit version tags remain available as permanent versioned releases.
      # Release notes are not auto-generated, so AI contributor lists are never
      # injected by this workflow.
      - name: Attach installer to versioned Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/LifePlannerPortableSetup.exe

      # Always capture enough evidence to diagnose the next failure without
      # weakening the failing step or changing the original job result.
      - name: Capture CI failure diagnostics
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'lps-ci-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $summary = Join-Path $diagnostics 'environment.txt'
          @(
            "repository=$env:GITHUB_REPOSITORY"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "sha=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "node=$(node --version 2>$null)"
            "npm=$(npm --version 2>$null)"
            "dotnet=$(dotnet --version 2>$null)"
            "pwsh=$($PSVersionTable.PSVersion)"
          ) | Set-Content -LiteralPath $summary

          Add-Content -LiteralPath $summary -Value "`nrelease directory:"
          if (Test-Path -LiteralPath 'release') {
            Get-ChildItem -LiteralPath 'release' -Force -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize | Out-String | Add-Content -LiteralPath $summary
          } else {
            Add-Content -LiteralPath $summary -Value '(release directory not created)'
          }

          $npmLogs = Join-Path $env:LOCALAPPDATA 'npm-cache\_logs'
          if (Test-Path -LiteralPath $npmLogs) {
            $dest = Join-Path $diagnostics 'npm-logs'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Get-ChildItem -LiteralPath $npmLogs -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 5 |
              Copy-Item -Destination $dest -Force -ErrorAction SilentlyContinue
          }

          "### Build Installer failure diagnostics" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          '```text' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Get-Content -LiteralPath $summary | Select-Object -First 120 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if (Test-Path -LiteralPath (Join-Path $diagnostics 'runtime-safety.log')) {
            "Runtime-safety output is attached in the diagnostic artifact." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload CI failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lps-ci-diagnostics
          if-no-files-found: warn
          retention-days: 7

      # A failed build must leave an explicit warning on the rolling release.
      # The older binary remains available for recovery but cannot masquerade as
      # a current build.
      - name: Mark rolling release stale after failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA
          gh release view 'latest-main' --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            $notes = "STALE INSTALLER: the build for current main commit $sha failed. Existing assets were produced by an older successful commit and are not the current application. Inspect the failed Build Installer workflow before using or distributing them."
            gh release edit 'latest-main' --repo $repo --title 'Latest main build (STALE - BUILD FAILED)' --notes $notes
          }
