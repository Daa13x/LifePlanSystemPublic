# Build Android — CI pipeline for the LifePlanSystem Closed Beta v0.1 APK.
#
# This machine has no local Android SDK / JDK17, so the debug APK is built
# entirely on a GitHub-hosted runner (ubuntu-latest ships a pre-installed
# Android SDK + accepted licenses) instead of requiring a local install.
# This produces a DEBUG-signed APK only (Android's own debug keystore,
# auto-generated by the Android Gradle Plugin) -- appropriate for a closed
# beta installed via "unknown sources", not a Play Store release build.
# No new secrets/credentials are introduced by this workflow.
#
# What it does: on a push to main touching the Android/Capacitor surface,
# or on manual dispatch, it builds the web app, syncs it into the Android
# project, builds a debug APK with Gradle, and uploads it as a downloadable
# workflow artifact. It does not publish a GitHub Release (unlike the
# desktop installer workflow) -- a closed-beta APK is handed out directly,
# not distributed as a public release asset.

name: Build Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_FETCH_RETRIES: '3'
      NPM_CONFIG_FETCH_RETRY_FACTOR: '2'
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify maintainer-only attribution
        run: >
          node scripts/verify-maintainer-attribution.mjs
          "${{ github.event.before }}"
          "${{ github.sha }}"
          "${{ github.ref }}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      # The Capacitor-bundled Cordova compatibility module
      # (android/capacitor-cordova-android-plugins/build.gradle) declares
      # sourceCompatibility/targetCompatibility JavaVersion.VERSION_21 --
      # JDK 17 fails that module with "invalid source release: 21" (found by
      # running this workflow for real and reading the actual Gradle error,
      # not assumed in advance).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install browser used by the Android viewport regression
        run: npx playwright install chromium

      - name: Verify Android local data and phone UI
        run: npm run verify:android-beta

      - name: Build web app
        run: npm run build

      # Copies dist/ into android/app/src/main/assets/public and syncs any
      # Capacitor plugin config -- must run after every web build, before
      # the Android build, or the APK would bundle a stale/missing web app.
      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate built APK
        id: apk
        run: |
          set -euo pipefail
          apk_path=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$apk_path" ]; then
            echo "No debug APK was produced." >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      # Static structural gate: prove the artifact is a real, correctly
      # packaged Android package before it's ever handed to a tester --
      # catches a wrong applicationId/version, a missing INTERNET
      # permission, or a build that silently produced a debuggable-but-
      # broken shell. aapt ships with the Android SDK build-tools already
      # present on ubuntu-latest runners (found via `find`, not assumed at
      # a hardcoded path, since the exact build-tools version varies).
      - name: Verify APK structure and metadata
        run: |
          set -euo pipefail
          apk_path="${{ steps.apk.outputs.path }}"
          aapt_path=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -print -quit)
          if [ -z "$aapt_path" ]; then
            echo "No aapt binary found under \$ANDROID_HOME/build-tools." >&2
            exit 1
          fi
          echo "Using aapt: $aapt_path"
          badging=$("$aapt_path" dump badging "$apk_path")
          echo "$badging"
          echo "$badging" | grep -q "package: name='com.lifeplansystem.app'" || { echo "Unexpected applicationId." >&2; exit 1; }
          echo "$badging" | grep -q "uses-permission: name='android.permission.INTERNET'" || { echo "Missing INTERNET permission." >&2; exit 1; }
          echo "$badging" | grep -q "launchable-activity: name='com.lifeplansystem.app.MainActivity'" || { echo "Missing launcher MainActivity." >&2; exit 1; }
          unzip -l "$apk_path" | grep -q "assets/public/index.html" || { echo "Bundled web app (assets/public/index.html) is missing from the APK." >&2; exit 1; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: LifePlanSystem-Closed-Beta-v0.1-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Capture CI failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p /tmp/lps-android-diagnostics
          {
            echo "repository=${GITHUB_REPOSITORY:-}"
            echo "run_id=${GITHUB_RUN_ID:-}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT:-}"
            echo "sha=${GITHUB_SHA:-}"
            echo "ref=${GITHUB_REF:-}"
            echo "node=$(node --version 2>/dev/null || true)"
            echo "npm=$(npm --version 2>/dev/null || true)"
            echo "java=$(java -version 2>&1 || true)"
          } > /tmp/lps-android-diagnostics/environment.txt
          if [ -d android/app/build/outputs ]; then
            find android/app/build/outputs -type f > /tmp/lps-android-diagnostics/apk-outputs.txt || true
          fi

      - name: Upload CI failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lps-android-diagnostics
          if-no-files-found: warn
          retention-days: 7
